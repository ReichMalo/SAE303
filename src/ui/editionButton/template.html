<div class="edition-buttons-wrapper">
  <!-- Bouton Crayon (édition) -->
  <button class="edition-button edition-btn">
    <svg
      width="39"
      height="39"
      viewBox="0 0 39 39"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <g id="iconeCrayon">
        <circle id="contour" cx="19.5" cy="19.5" r="19.5" fill="#4E4CC9" />
        <g id="crayon">
          <rect
            id="baton"
            x="6"
            y="27.1335"
            width="21.4021"
            height="8.2981"
            rx="1"
            transform="rotate(-45 6 27.1335)"
            fill="white"
          />
          <path
            id="pointe"
            d="M29.0844 8.82174C29.8761 8.70893 30.5545 9.38737 30.4417 10.179L29.6831 15.5029C29.5436 16.482 28.3459 16.8815 27.6465 16.1821L23.0813 11.6169C22.382 10.9175 22.7814 9.71988 23.7606 9.58036L29.0844 8.82174Z"
            fill="white"
          />
        </g>
      </g>
    </svg>
  </button>

  <!-- Conteneur des boutons validation et cancel -->
  <div class="validation-buttons hidden">
    <!-- Bouton Validation (checkmark) -->
    <button class="edition-button validation-btn">
      <svg
        width="39"
        height="39"
        viewBox="0 0 39 39"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <g id="valid">
          <circle
            id="contour-valid"
            cx="19.5"
            cy="19.5"
            r="19.5"
            fill="#4DD86D"
          />
          <g id="checkmark">
            <rect
              id="Rectangle 286"
              x="15.7271"
              y="29.6306"
              width="25.1486"
              height="5.82932"
              transform="rotate(-62.8107 15.7271 29.6306)"
              fill="#D9D9D9"
            />
            <rect
              id="Rectangle 287"
              x="8.86523"
              y="19.8218"
              width="16.3098"
              height="5.82932"
              transform="rotate(27.1893 8.86523 19.8218)"
              fill="#D9D9D9"
            />
          </g>
        </g>
      </svg>
    </button>

    <!-- Bouton Cancel (X rouge) -->
    <button class="edition-button cancel-btn">
      <svg
        width="39"
        height="39"
        viewBox="0 0 39 39"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <g id="invalid">
          <circle
            id="contour-invalid"
            cx="19.5"
            cy="19.5"
            r="19.5"
            fill="#E32222"
          />
          <g id="cross">
            <rect
              id="Rectangle 288"
              x="8.68628"
              y="27.071"
              width="26"
              height="6"
              transform="rotate(-45 8.68628 27.071)"
              fill="#D9D9D9"
            />
            <rect
              id="Rectangle 289"
              width="26"
              height="6"
              transform="matrix(-0.707107 -0.707107 -0.707107 0.707107 31.3137 27.071)"
              fill="#D9D9D9"
            />
          </g>
        </g>
      </svg>
    </button>
  </div>
</div>
