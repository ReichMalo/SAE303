<div class="info-panel hidden">
  <div class="info-panel__content">
    <h2 class="info-panel__title">{{title}}</h2>
    <div class="info-panel__text">
      <p>{{description}}</p>
    </div>
    <div class="info-panel__selector">
      <div class="selector__bar">
        <div class="selector__track"></div>
        <div class="selector__handle"></div>
      </div>

      <div class="selector__labels">
        <span class="selector__label" data-value="1">1</span>
        <span class="selector__label" data-value="2">2</span>
        <span class="selector__label" data-value="3">3</span>
        <span class="selector__label" data-value="4">4</span>
        <span class="selector__label" data-value="5">5</span>
      </div>
    </div>

    <div class="info-panel__footer">
      <button class="info-panel__close">Fermer</button>
    </div>
  </div>
</div>
